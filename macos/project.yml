# XcodeGen spec for the SlurmBar app target.
#
#   cd macos && xcodegen generate && open SlurmBar.xcodeproj
#
# The generated SlurmBar.xcodeproj is gitignored — this file is the source of truth.
# Requires full Xcode; SlurmKit itself builds and tests with Command Line Tools alone
# (see macos/scripts/test-slurmkit.sh).
#
# Naming is a codename and the bundle id is a placeholder: both are renamed before any
# public release, so nothing may depend on them semantically (ARCHITECTURE.md § Decisions).

name: SlurmBar

options:
  bundleIdPrefix: local.slurmbar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SlurmKit:
    path: SlurmKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is deferred to Phase 5 (Developer ID + notarization + Sparkle). Until then
    # local and CI builds are ad-hoc/unsigned. The app is deliberately NOT sandboxed:
    # ControlMaster sockets and ~/.ssh/config are incompatible with the App Store sandbox.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  SlurmBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      # Folder *reference* (not a group): the whole directory is copied into
      # SlurmBar.app/Contents/Resources/fixtures, and because Xcode tracks the folder
      # rather than a snapshot of its contents, re-running `npm run export-fixtures`
      # is picked up by the next build with no project regeneration. Demo mode reads
      # these — the same golden JSONs the SlurmKit tests use, so the app's demo data
      # and the parity contract can never drift apart.
      - path: ../fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: SlurmKit
        product: SlurmKit
    info:
      # Generated by `xcodegen generate`; edit the properties here, not the plist.
      path: App/Info.plist
      properties:
        CFBundleName: SlurmBar
        CFBundleDisplayName: SlurmBar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Menubar-only agent: no Dock icon, no main window.
        LSUIElement: true
        # Deliberately ABSENT: NSAppleEventsUsageDescription. The 2FA fallback writes a
        # temporary executable `.command` file and hands it to Terminal via NSWorkspace
        # (see TerminalLauncher.swift), so the app never drives Terminal through Apple
        # Events and macOS never shows an automation consent prompt.
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: SlurmBar
        PRODUCT_BUNDLE_IDENTIFIER: local.slurmbar.dev
        GENERATE_INFOPLIST_FILE: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_PREVIEWS: "YES"
    postBuildScripts:
      # Mirrors the ad-hoc signing step in scripts/build-app.sh. With CODE_SIGNING_ALLOWED=NO
      # the product is only linker-signed and its code-signing identifier is "SlurmBar" rather
      # than the bundle id, which makes notificationd refuse delivery — so notifications would
      # be silently dead in every ⌘R run from Xcode. Re-signing infers the identifier from
      # CFBundleIdentifier. Real Developer ID signing lands in Phase 5.
      - name: Ad-hoc codesign
        script: codesign --force --sign - "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
        # The phase declares no outputs, so without this Xcode warns on every build that it
        # cannot dependency-analyse it. Signing must in fact re-run every build.
        basedOnDependencyAnalysis: false

schemes:
  SlurmBar:
    build:
      targets:
        SlurmBar: all
    run:
      config: Debug
      # Listed (not omitted) so they appear as checkboxes under Edit Scheme ▸ Run ▸ Arguments
      # and can be toggled from the UI without editing this file. Only demo mode is on by
      # default — see App/SlurmBarApp.swift for what each flag does.
      environmentVariables:
        - variable: SLURMBAR_DEMO
          value: "1"
          isEnabled: true
        # There is no window to open otherwise: LSUIElement + MenuBarExtra means the popover is
        # the whole UI, so a plain ⌘R looks like nothing happened. This hosts the same root view
        # in a real window.
        - variable: SLURMBAR_DEBUG_WINDOW
          value: "1"
          isEnabled: false
        - variable: SLURMBAR_SIMULATE_NOTIFICATION
          value: "1"
          isEnabled: false
        - variable: SLURMBAR_TRACE
          value: "1"
          isEnabled: false
    archive:
      config: Release
